name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정 실행
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Waka Stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TOTAL_CODE_TIME: "true"       # ✅ 총 코딩 시간
          SHOW_LANGUAGE: "true"              # ✅ 언어 비율
          SHOW_PROJECTS: "true"              # ✅ 프로젝트별 통계
          SHOW_EDITORS: "false"              # ❌ 원하면 true
          SHOW_OS: "false"                   # ❌ 운영체제 통계
          SHOW_LINES_OF_CODE: "true"         # ✅ 코드 라인 수
          SHOW_UPDATED_DATE: "true"          # ✅ 업데이트 날짜 표시
