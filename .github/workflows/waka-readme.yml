name: Waka Readme

on:
  schedule:
    - cron: '0 15 * * *'   # Asia/Seoul 자정(UTC 15:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check GH_TOKEN validity
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/user)
          if [ "$code" != "200" ]; then
            echo "GH_TOKEN is invalid (HTTP $code). Recreate a classic PAT with repo,user scopes and update the secret."
            exit 1
          fi

      - name: Update WakaTime stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TOTAL_CODE_TIME: "true"
          SHOW_LANGUAGE: "true"
          SHOW_PROJECTS: "true"
          SHOW_LINES_OF_CODE: "true"
          SHOW_LANGUAGE_PER_REPO: "true"
          SHOW_LOC_CHART: "true"
          SHOW_UPDATED_DATE: "true"
          SHOW_COMMIT: "false"
          SHOW_DAYS_OF_WEEK: "false"
          SHOW_TIMEZONE: "false"
          SHOW_PROFILE_VIEWS: "false"
          SHOW_SHORT_INFO: "false"
          SHOW_OS: "false"
          SHOW_EDITORS: "false"
          COMMIT_MESSAGE: "Updated with Dev Metrics"
          LOCALE: "en"
